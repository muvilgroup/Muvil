{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Type Ahead 👀</title>
    <link rel="stylesheet" href="style.css">
    <!----- Boostrap ----->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">

</head>
<body>

<button type="button" class = "btn btn-primary" data-toggle="modal" data-target="#exampleModal">Launch modal</button>
<a class="menu-item-nav" data-toggle="modal" href="#exampleModal">Iniciar sesión</a>
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="blue" class="bi bi-person-bounding-box" viewBox="0 0 16 16">
  <path d="M1.5 1a.5.5 0 0 0-.5.5v3a.5.5 0 0 1-1 0v-3A1.5 1.5 0 0 1 1.5 0h3a.5.5 0 0 1 0 1h-3zM11 .5a.5.5 0 0 1 .5-.5h3A1.5 1.5 0 0 1 16 1.5v3a.5.5 0 0 1-1 0v-3a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 1-.5-.5zM.5 11a.5.5 0 0 1 .5.5v3a.5.5 0 0 0 .5.5h3a.5.5 0 0 1 0 1h-3A1.5 1.5 0 0 1 0 14.5v-3a.5.5 0 0 1 .5-.5zm15 0a.5.5 0 0 1 .5.5v3a1.5 1.5 0 0 1-1.5 1.5h-3a.5.5 0 0 1 0-1h3a.5.5 0 0 0 .5-.5v-3a.5.5 0 0 1 .5-.5z"/>
  <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3zm8-9a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
</svg>


<div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Inicia Sesión</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form>
          <div class="form-group row d-flex justify-content-center">
            <label for="user_name" class="col-form-label col-3">Usuario:</label>
            <input type="text" class="form-control col-6" id="user_name">
          </div>
          <div class="form-group row d-flex justify-content-center">
            <label for="password" class="col-form-label col-3">Contraseña:</label>
            <input type="text" class="form-control col-6" id="password">
          </div>
          <a class="form-group row d-flex justify-content-center" href="/user_register">¿No tienes cuenta? Regístrate</a>
        </form>
      </div>
      <div class="modal-footer ">
        <button type="button" class="btn btn-primary col-3">Entrar</button>
        <button type="button" class="btn btn-secondary col-3" data-dismiss="modal">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<form class="search-form">
    <input type="text" class="search" placeholder="City">
    <ul class="suggestions">
        <li>Filter for a city</li>
    </ul>
</form>

    <!----- Boostrap ----->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>

    <!----- custom JS ----->
    <script>
            const endpoint = '{% static 'json/spain_cities.json' %}';
    const cities = [];

    fetch(endpoint)
        .then(blob => blob.json())
        .then(data => cities.push(...data));

    function findMatches(wordToMatch, cities) {
        return cities.filter(place => {
            const regex = new RegExp(wordToMatch, 'gi');
            return place.city.match(regex);
        });
    }

    function displayMatches(e) {
        const matchedArray = findMatches(e.target.value, cities);
        const html = matchedArray.map(place => {
            const regex = new RegExp(e.target.value, 'gi');
            const cityName = place.city.replace(regex,
                `<span class=hl>${e.target.value}</span>`)
            return `
                <li>
                    <span class="name">${cityName}</span>
                    <span class="people">${place.population}</span>
                </li>
            `
        }).join('');
        suggestions.innerHTML = html;
    }

    const search = document.querySelector('.search');
    const suggestions = document.querySelector('.suggestions');

    search.addEventListener('change', displayMatches);
    search.addEventListener('keyup', displayMatches);
    </script>

</body>
</html>
