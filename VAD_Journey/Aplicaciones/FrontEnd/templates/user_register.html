{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>VAD</title>
    <link type='text/css' href='{% static "css/user_register.css" %}' rel='stylesheet' />
    <!----- Boostrap ----->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">

</head>
<body id="iywx" class="row d-flex justify-content-center">
    <h1 class="row d-flex justify-content-center">INGRESE SUS DATOS PERSONALES</h1>
    <div class="row d-flex justify-content-center col-8 bg-primary text-white py-4">
        <form id="formularioNuevoUsuario" class="row g-3" action="/save_user/" method="POST"> {% csrf_token %}
            <div class="col-md-6">
                <input type="text" id="txtEmail" name="txtEmail" class="form-control" maxlength="320" placeholder="Email" autofocus>
            </div>
            <div class="col-md-6">
                <input type="password" id="txtPass" name="txtPass" class="form-control" maxlength="30" placeholder="Password" autofocus required>
            </div>
            <div class="col-md-4">
                <input type="text" id="txtNombre" name="txtNombre" class="form-control" minlength="3" maxlength="64" placeholder="Nombre" autofocus required>
            </div>
            <div class="col-md-4">
                <input type="text" id="txtApe1" name="txtApe1" class="form-control" minlength="3" maxlength="64" placeholder="Primer Apellido" autofocus required>
            </div>
            <div class="col-md-4">
                <input type="text" id="txtApe2" name="txtApe2" class="form-control" minlength="3" maxlength="64" placeholder="Segundo Apellido" autofocus>
            </div>
            <div class="col-md-12">
                <input type="date" id="datFechaNac" name="datFechaNac" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label>Tipo de documento...</label>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="txtTipoDoc" id="txtTipoDoc1" value="DNI" checked>
                  <label class="form-check-label" for="txtTipoDoc1">DNI</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="txtTipoDoc" id="txtTipoDoc2" value="NIE">
                  <label class="form-check-label" for="txtTipoDoc2">NIE</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="txtTipoDoc" id="txtTipoDoc3" value="PASSPORT">
                  <label class="form-check-label" for="txtTipoDoc3">PASSPORT</label>
                </div>
            </div>
            <div class="col-md-6">
                <input type="number" id="numDoc" name="numDoc" class="form-control" placeholder="Numero documento" autofocus>
            </div>
            <div class="col-md-12">
                <input type="number" id="numTelefono" name="numTelefono" class="form-control" placeholder="Numero de Telefono" autofocus>
            </div>
            <div class="col-md-12">
                <label>Seleccione un género...</label>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="txtGenero" id="txtGeneroM" value="M" checked>
                  <label class="form-check-label" for="txtGeneroM">Masculino</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="txtGenero" id="txtGeneroF" value="F">
                  <label class="form-check-label" for="txtGeneroF">Femenino</label>
                </div>
            </div>
            <div class="col-md-12">
                <div class="mb-5">
                    <label for="userImg" class="form-label btn btn-outline-light">Carga tu foto de perfil...</label>
                    <input class="form-control" type="file" id="userImg" name="userImg" onchange="preview()">
                    <button onclick="clearImage()" class="btn btn-danger mt-3">Cancelar imagen</button>
                </div>
                <img id="frame" src="" class="img-fluid" />
            </div>
            <div class="col-md-12">
                <input type="submit" class="btn btn-success w-100 text-white" value="Guardar"/>
            </div>
        </form>
    </div>

    <!----- Boostrap ----->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.5/dist/umd/popper.min.js" integrity="sha384-Xe+8cL9oJa6tN/veChSP7q+mnSPaj5Bcu9mPX5F5xIGE0DVittaqT5lorf0EI7Vk" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.min.js" integrity="sha384-kjU+l4N0Yf4ZOJErLsIcvOU2qSb74wXpOhqTvwVx3OElZRweTnQ6d31fXEoRD1Jy" crossorigin="anonymous"></script>
    <!----- JS a pelo!!! ----->
    <script>
            function preview() {
                frame.src = URL.createObjectURL(event.target.files[0]);
            }
            function clearImage() {
                document.getElementById('formFile').value = null;
                frame.src = "";
            }
    </script>
</body>
</html>
