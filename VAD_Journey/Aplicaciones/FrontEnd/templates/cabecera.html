			<!-- INICIO Modal inicio sesión -->
			<div class="modal fade" id="userModal" tabindex="-1" role="dialog" aria-labelledby="userModalLabel" aria-hidden="true">
			  <div class="modal-dialog" role="document">
				<div class="modal-content text-dark">
				  <div class="modal-header border border-4 border-primary bg-primary text-white">
					<h5 class="modal-title" id="userModalLabel">Introduce los datos de tu usuario...</h5>
					<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					  <span aria-hidden="true">&times;</span>
					</button>
				  </div>
				  <div class="modal-body border border-4 border-primary">
					<form method="POST" action="/main/"> {% csrf_token %}
					  <div class="form-group row d-flex justify-content-center">
						<label for="txtEmail" class="col-form-label col-3">Email:</label>
						<input type="text" class="form-control col-6" id="txtEmail" name="txtEmail">
					  </div>
					  <div class="form-group row d-flex justify-content-center">
						<label for="txtPass" class="col-form-label col-3">Contraseña:</label>
						<input type="text" class="form-control col-6" id="txtPass" name="txtPass">
					  </div>
					  <a class="form-group row d-flex justify-content-center" href="/nuevo_usuario">¿No tienes cuenta? Regístrate</a>
					  <div class="modal-footer ">
						<input type="submit" class="btn btn-primary col-3 text-white" value="Entrar"/>
						<button type="button" class="btn btn-secondary col-3 text-white" data-dismiss="modal">Cancelar</button>
					  </div>
					</form>
				  </div>
				</div>
			  </div>
			</div>
			<!-- FIN Modal inicio sesión -->
