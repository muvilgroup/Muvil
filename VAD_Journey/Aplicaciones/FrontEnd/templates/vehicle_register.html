{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>VAD</title>
    <link type='text/css' href='{% static "css/vehicle_register.css" %}' rel='stylesheet' />
    <!----- Boostrap ----->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
</head>
<body id="iywx"  class="row d-flex justify-content-center">
    <h1 class="row d-flex justify-content-center">INGRESE LOS DATOS DEL VEHICULO</h1>
    <div class="row d-flex justify-content-center col-8 bg-warning text-white py-4">
        <form id="formularioNuevoVehiculo" class="row g-3" action="/save_vehicle/" method="POST"> {% csrf_token %}
            <div class="col-md-12">
                <input type="number" id="numIdP" name="numIdP" class="form-control" value="{{ID_Persona}}" hidden autofocus>
            </div>
            <div class="col-md-3">
                <label>Tipo:</label>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="txtTipoVehiculo" id="txtTipoVehiculo1" value="Combustible" checked>
                  <label class="form-check-label" for="txtTipoVehiculo1">Combustible</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="txtTipoVehiculo" id="txtTipoVehiculo2" value="Electrico">
                  <label class="form-check-label" for="txtTipoVehiculo2">Electrico</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="txtTipoVehiculo" id="txtTipoVehiculo3" value="Hibrido">
                  <label class="form-check-label" for="txtTipoVehiculo3">Hibrido</label>
                </div>
            </div>
            <div class="col-md-3">
                <input type="text" id="txtMarca" name="txtMarca" class="form-control" minlength="3" maxlength="64" placeholder="Marca" autofocus required>
            </div>
            <div class="col-md-3">
                <input type="text" id="txtModelo" name="txtModelo" class="form-control" minlength="3" maxlength="64" placeholder="Modelo" autofocus required>
            </div>
            <div class="col-md-3">
                <input type="text" id="txtColor" name="txtColor" class="form-control" minlength="3" maxlength="12" placeholder="Color" autofocus required>
            </div>
            <div class="col-md-6">
                <input type="number" id="numAnosAnt" name="numAnosAnt" class="form-control" placeholder="Años de antiguedad" autofocus>
            </div>
            <div class="col-md-6">
                <input type="number" id="numAsientos" name="numAsientos" class="form-control" placeholder="Asientos totales" autofocus>
            </div>
            <div class="col-md-6">
                <label>Aceptas fumadores?</label>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="flgFumador" id="flgFumador1" value="True">
                  <label class="form-check-label" for="flgFumador1">Si</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="flgFumador" id="flgFumador2" value="False" checked>
                  <label class="form-check-label" for="flgFumador2">No</label>
                </div>
            </div>
            <div class="col-md-6">
                <label>Aceptas mascotas?</label>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="flgMascotas" id="flgMascotas1" value="True">
                  <label class="form-check-label" for="flgMascotas1">Si</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="flgMascotas" id="flgMascotas2" value="False" checked>
                  <label class="form-check-label" for="flgMascotas2">No</label>
                </div>
            </div>
            <div class="col-md-12">
                <input type="submit" class="btn btn-success w-100 text-white" value="Guardar"/>
            </div>
        </form>
    </div>

    <!----- Boostrap ----->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.5/dist/umd/popper.min.js" integrity="sha384-Xe+8cL9oJa6tN/veChSP7q+mnSPaj5Bcu9mPX5F5xIGE0DVittaqT5lorf0EI7Vk" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.min.js" integrity="sha384-kjU+l4N0Yf4ZOJErLsIcvOU2qSb74wXpOhqTvwVx3OElZRweTnQ6d31fXEoRD1Jy" crossorigin="anonymous"></script>

</body>
</html>
