	<title>Bootstrap 5</title>
	<link rel="stylesheet" href="../static/css/bootstrap5/bootstrap.min.css">

	<style>
		.cabecera {
			height: 140px;
			background: linear-gradient(to right, #FFFFFF, #FFFFFF);
		}
		.navpane {
			background: linear-gradient(to right, #FFFFFF, #FFFFFF);
		}
		.yellow-bar {
			border-bottom-style: solid;
			border-bottom-width: medium;
			border-bottom-color: #FAFAD2;
		}
		.scrollbar-sunny-morning::-webkit-scrollbar-track {
			-webkit-box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.1);
			background-color: #F5F5F5;
			border-radius: 10px;
		}

		.scrollbar-sunny-morning::-webkit-scrollbar {
			width: 12px;
			background-color: #F5F5F5;
		}

		.scrollbar-sunny-morning::-webkit-scrollbar-thumb {
			border-radius: 10px;
			-webkit-box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.1);
			background-image: -webkit-linear-gradient(330deg, #f6d365 0%, #fda085 100%);
			background-image: linear-gradient(120deg, #f6d365 0%, #fda085 100%);
		}

		.scrollbar-sunny-morning {
			scrollbar-color: #f6d365 #F5F5F5;
		}
		.my-custom-scrollbar {
		  position: relative;
		  width: 1050px;
		  height: 600px;
		  overflow: auto;
		}
		.nav-pills > button.active, .nav-pills > button.active:focus, .nav-pills > button.active:hover{
			color: #000000;
			background-color: #CACACA;
			font-weight: bold;
		}
		.nav-pills > button, .nav-pills > button:focus {
			color: #B1ACAC;
			background-color: #F9F4F4;
		}
		.nav-pills > button:hover {
			color: #000000;
			background-color: #CACACA;
			font-weight: bold;
		}
		.nav-pills > button:focus-within {
			color: #000000;
			background-color: #CACACA;
			font-weight: bold;
		}
		#v-pills-home-tab {
			color: #000000;
		  	background-color: #CACACA;
		  	font-weight: 900;
		}
		#car-card {
        	background-color: #F9F4F4
      	}
      	#car-card label{
        	color: #B1ACAC;
        	font-weight: bold;
      	}
		.img-container{
		  	width:300px;
		  	height:200px;
		  	overflow:hidden;
		}
		.img-container img{
		  	width:100%;
		  	height:auto
		}
	</style>
</head>

					<!-- INICIO Datos Personales -->
					<div class="row">
						<div class="col-12 px-3 pt-2">
							<h3 class="border-bottom border-5 border-warning">Datos Personales</h3>
						</div>
					</div>
					<form class="row px-2 pt-2" id="form-datospersonales">
						<div class="col-8 d-flex justify-content-center align-items-center py-3">
							<button class="btn btn-warning border-light border-3 fw-bold"> Ver Perfil Público </button>
						</div>
						<div class="col-3 mb-3 ps-5 button-container">
							<img class="img-thumbnail rounded-circle" src="../static/img/personas/6.jpg">
							<!--<embed src="../static/icon/pencil-fill.svg" />-->
							<a href="" alt="Editar"><embed src="../static/icon/pencil-fill.svg" alt="Editar"/></a>
						</div>
						<div class="col-md-4 py-2">
							<label for="inputNombre" class="form-label">Nombre</label>
							<input type="text" class="form-control" id="inputNombre">
						</div>
						<div class="col-md-4 py-2">
							<label for="inputPApellido" class="form-label">Primer Apellido</label>
							<input type="text" class="form-control" id="inputPApellido">
						</div>
						<div class="col-md-4 py-2">
							<label for="inputSapellido" class="form-label">Segundo Apellido</label>
							<input type="text" class="form-control" id="inputSapellido">
						</div>
						<div class="col-md-4 d-flex align-self-center py-2">
							<div class="form-check form-check-inline">
								<input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="DNI" checked>
								<label class="form-check-label" for="inlineRadio1">DNI</label>
							</div>
							<div class="form-check form-check-inline">
								<input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="NIE">
								<label class="form-check-label" for="inlineRadio2">NIE</label>
							</div>
							<div class="form-check form-check-inline">
								<input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio3" value="Pasaporte">
								<label class="form-check-label" for="inlineRadio3">Pasaporte</label>
							</div>
						</div>
						<div class="col-md-4 py-2">
							<label for="inputDocumento" class="form-label">Número Documento</label>
							<input type="text" class="form-control" id="inputDocumento">
						</div>
						<div class="col-md-4 py-2">
							<label for="inputNacimiento" class="form-label">Fecha de Nacimiento</label>
							<input type="date" class="form-control" id="inputNacimiento">
						</div>
						<div class="col-md-7 py-2">
							<label for="inputEmail" class="form-label">Email</label>
							<input type="email" class="form-control" id="inputEmail" placeholder="">
						</div>
						<div class="col-md-2 py-2">
							<label for="inputState" class="form-label">Prefijo</label>
							<select id="inputState" class="form-select">
								<option selected>+34 España</option>
								<option>+95 Inglaterra</option>
								<option>+21 USA</option>
							</select>
						</div>
						<div class="col-md-3 py-2">
							<label for="inputTelefono" class="form-label">Teléfono</label>
							<input type="text" class="form-control" id="inputTelefono" placeholder="">
						</div>
						<div class="col-12 py-2">
							<label for="exampleFormControlTextarea1" class="form-label">Déjanos conocerte</label>
							<textarea class="form-control" id="exampleFormControlTextarea1" rows="3" placeholder="Descríbete en pocas palabras y encuentra gente como tú..."></textarea>
						</div>
						<div class="col-12 d-flex justify-content-center py-3">
							<button type="submit" class="btn btn-warning btn-guardar col-4"><b>Guardar</b></button>
						</div>
					</form>
					<!-- FIN Datos Personales -->

				<div class="tab-pane fade" id="v-pills-coches" role="tabpanel" aria-labelledby="v-pills-coches-tab">

						<div class="col-12">
							<h3 class="border-bottom border-5 border-warning">Mis Coches</h3>
						</div>
					</div>
					<div class="row px-3 pt-2 pb-3">
						<div class="col-12 d-flex justify-content-end">
							<button class="btn btn-warning col-2" data-bs-toggle="collapse" href="#collapseAddCar" role="button" aria-expanded="false" aria-controls="collapseAddCar">

								<b>Añadir Coche</b>
							</button>
						</div>
						<div class="collapse" id="collapseAddCar">
							<div class="card card-body col-8 mx-auto">
								<h3 class="border-bottom border-5 border-warning">Introduce los datos del nuevo vehículo...</h3>
								<form class="row px-2 pt-2" id="form-newcar">
									<div class="col-6">
										<div class="col-12 ">
											<label for="inputMarca" class="form-label">Marca</label>
											<input type="text" class="form-control" id="inputMarca">
										</div>
										<div class="col-12 ">
											<label for="inputModelo" class="form-label">Modelo</label>
											<input type="text" class="form-control" id="inputModelo">
										</div>
										<div class="col-12 ">
											<label for="inputAnio" class="form-label">Año</label>
											<input type="text" class="form-control" id="inputAnio">
										</div>
										<div class="col-12 ">
											<label for="inputMatricula" class="form-label">Matrícula</label>
											<input type="text" class="form-control" id="inputMatricula">
										</div>
										<div class="col-12 ">
											<label for="inputColor" class="form-label">Color</label>
											<input type="text" class="form-control" id="inputColor">
										</div>
										<div class="col-12">
											<label for="inputNumPlazas" class="form-label">Nº Plazas</label>
											<input type="text" class="form-control" id="inputNumPlazas">
										</div>
