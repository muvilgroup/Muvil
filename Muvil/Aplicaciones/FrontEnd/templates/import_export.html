{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Import</title>

</head>

<body>

	{% include "index.html" %}
	{% include 'including/messages.html' %}

	<div class="container-lg mt-2 content-section">
  	 	<div class="col-12 px-3 pt-2">
			<h3 class="border-bottom border-5 border-warning">Importar fichero</h3>
		</div>
        <div class="d-flex justify-content-center my-2 px-2">
			<form method="POST" enctype="multipart/form-data"> {% csrf_token %}
				{{ form.modelo }}
				<br>
				{{ form.fichero_import }}
				<div class="row justify-content-center my-2 px-2">
					<button type="submit" id="btn-guardar" class="col-auto btn btn-warning border-light border-3 fw-bold">
						Importar Datos
					</button>
				</div>
			</form>
		</div>
  	</div>

</body>

</html>
