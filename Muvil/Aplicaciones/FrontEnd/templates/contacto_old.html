{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contacto</title>

	<style>

    </style>

	<link type='text/css' href='{% static "css/contacto.css" %}' rel='stylesheet' />

</head>

<body>

	{% include "cabecera.html" %}

	{% if 'valido' in request.GET %}
	<p class="fw-bold fs-5 text-center bg-warning"> Mensaje enviado correctamente!!! </p>
	{% elif 'error' in request.GET%}
	<p class="fw-bold fs-5 text-center bg-warning"> Error al enviar el mensaje!!! </p>
	{% endif %}

	<div class="container">
		<h1 class="mt-5">Formulario de Contacto</h1>
		<form action="#" method="POST"> {% csrf_token %}
		  <div class="mb-3">
			<label for="email2" class="form-label">Correo electrónico</label>
			<input type="text" class="form-control bg-light" id="email2" name="email2" value="{% if user.is_authenticated %} {{ user.email }} {% endif %}" readonly>
		  </div>
		  <div class="mb-3">
			<label for="subject" class="form-label">Asunto</label>
			<input type="text" class="form-control" id="subject" name="subject" required>
		  </div>
		  <div class="mb-3">
			<label for="message" class="form-label">Mensaje</label>
			<textarea class="form-control" id="message" name="message" rows="5" required></textarea>
		  </div>
		  <button type="submit" class="btn btn-warning fw-bold">Enviar</button>
		</form>
	  </div>

  </div>

</body>

</html>
